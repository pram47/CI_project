# Portfolio Optimization Configuration File
# Modify this file to customize the optimization parameters

[DATA]
# Stock symbols to include in the portfolio
stocks = AAPL, MSFT, GOOGL, JPM, PG, XOM, TSLA

# Historical data period (days back from today)
lookback_days = 730  # 2 years

[OPTIMIZATION]
# Risk aversion coefficient (lambda): 0 to 1
# 0 = maximize return, 0.5 = balanced, 1 = minimize risk
lambda_param = 0.5

# Number of PSO particles
pso_particles = 30

# Number of PSO iterations
pso_iterations = 100

[CONSTRAINTS]
# Minimum weight for any asset (no short selling)
min_weight = 0.0

# Maximum weight for any asset (per-stock limit)
max_weight_per_asset = 0.30

# Maximum number of active assets in portfolio
max_num_assets = 5

# Minimum allocation if asset is selected
min_investment_threshold = 0.05

# Lot size for transaction rounding (e.g., 0.01 = 1% lots)
lot_size = 0.01

# Risk-free rate for Sharpe ratio calculation
risk_free_rate = 0.02

[SECTOR_CONSTRAINTS]
# Define sectors and their maximum weights
# Format: sector_name = max_weight

tech_max_weight = 0.40
finance_max_weight = 0.25
consumer_max_weight = 0.25
energy_max_weight = 0.25

[SECTOR_MAPPING]
# Map stocks to sectors
# Format: stock_symbol = sector_name

AAPL = tech
MSFT = tech
GOOGL = tech
TSLA = tech
JPM = finance
PG = consumer
XOM = energy

[TRANSACTION_COSTS]
# Fixed transaction cost (% of portfolio)
fixed_cost = 0.001

# Variable transaction cost per transaction (% of transaction value)
variable_cost = 0.0005

[OUTPUT]
# Output directory for visualizations
output_dir = ./

# Visualization DPI (resolution)
visualization_dpi = 300

# Save results to CSV
save_results_csv = true
